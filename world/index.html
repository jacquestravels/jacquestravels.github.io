  <body>

          <ul class="navbar__menu">
            <li><a href="../world/index.html">world</a></li>

    <div class="gallery-image">

      </div>
      <div class="img-box">
        <img src="img/250103.jpg" alt="" />
        <div class="transparent-box">
          <div class="caption">
            <p>Great Wall of China, Beijing &#127464;&#127475;</p>
          </div>
        </div>
      </div>
      <div class="img-box">
        <img src="img/240403.jpg" alt="" />
        <div class="transparent-box">
          <div class="caption">
            <p>Kyoto Gyoen National Garden &#127471;&#127477;</p>

        </div>
      </div>
      <div class="img-box">
        <img src="img/240402.jpg" alt="" />
        <div class="transparent-box">
          <div class="caption">
            <p>Fushimi Inari Taisha, Kyoto &#127471;&#127477;</p>
          </div>
        </div>
      </div>
      <div class="img-box">
        <img src="img/240401.jpg" alt="" />
        <div class="transparent-box">
          <div class="caption">
            <p>Tokyo &#127471;&#127477;</p>

      </div>

        <img src="img/231201.jpg" alt="" />

          <div class="caption">

        </div>

      <div class="img-box">
        <img src="img/200101.jpg" alt="" />
        <div class="transparent-box">
          <div class="caption">
            <p>La Défense &#127467;&#127479;</p>
          </div>
        </div>
      </div>
    <div class="overlay" id="overlay">
      <img id="overlayImage" src="" alt="Expanded Image">
      <div class="description" id="overlayDescription">kjkljlkjl</div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const menu = document.getElementById('navbar-menu');
        const toggle = document.getElementById('mobile-menu');
        if (toggle && menu) {
          toggle.addEventListener('click', function () {
            const header = document.querySelector('.navbar');
            const headerRect = header.getBoundingClientRect();
            const top = Math.max(0, Math.floor(headerRect.bottom) - 1);
            menu.style.top = top + 'px';
            menu.style.maxHeight = `calc(100vh - ${top}px)`;
            menu.classList.toggle('active');
            toggle.classList.toggle('active');
          });
        }
      });
      const gallery = document.querySelector('.gallery-image');
      const overlay = document.getElementById('overlay');
      const overlayImage = document.getElementById('overlayImage');
      const overlayDescription = document.getElementById('overlayDescription');
      if (gallery) {
        gallery.addEventListener('click', (event) => {
          const imgBox = event.target.closest('.img-box');
          if (imgBox) {
            const img = imgBox.querySelector('img');
            const description = imgBox.querySelector('.caption p').textContent;
            overlayImage.src = img.src;
            overlayDescription.textContent = description;
            overlay.style.display = 'flex';
          }
        });
      }
      if (overlay) {
        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) {
            overlay.style.display = 'none';
            overlayImage.src = '';
            overlayDescription.textContent = '';
          }
        });
      }
    </script>
  </body>
</html>
